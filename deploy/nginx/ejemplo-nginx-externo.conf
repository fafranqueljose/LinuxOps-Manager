# ==============================================================================
# Configuración de referencia para tu NGINX EXTERNO (Host o Nginx Proxy Manager)
# Dominio: lnxops.crcltd.com.do
# Frontend: http://127.0.0.1:3002
# Backend:  http://127.0.0.1:8000
# ==============================================================================

# Si usas Nginx nativo en el host (/etc/nginx/sites-available/lnxops.conf):

server {
    listen 80;
    server_name lnxops.crcltd.com.do;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lnxops.crcltd.com.do;

    # Tus certificados SSL existentes
    ssl_certificate /ruta/a/tu/fullchain.pem;
    ssl_certificate_key /ruta/a/tu/privkey.pem;

    client_max_body_size 50M;

    # 1. API REST -> Backend (Puerto 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSockets (Agente y Terminal) -> Backend (Puerto 8000)
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Scripts de instalación del agente -> Backend (Puerto 8000)
    location = /install-agent.sh {
        proxy_pass http://127.0.0.1:8000/install-agent.sh;
        proxy_set_header Host $host;
    }

    location = /agent-bundle.tar.gz {
        proxy_pass http://127.0.0.1:8000/agent-bundle.tar.gz;
        proxy_set_header Host $host;
    }

    # 4. Frontend SPA -> Contenedor Frontend (Puerto 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

