services:
  db:
    image: postgres:16-alpine
    container_name: linuxops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linuxops_db}
      POSTGRES_USER: ${POSTGRES_USER:-linuxops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPasswordSecurely!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linuxops-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linuxops_user} -d ${POSTGRES_DB:-linuxops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  loki:
    image: grafana/loki:3.0.0
    container_name: linuxops-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - linuxops-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: linuxops-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-SUPER_SECRET_KEY_MUST_BE_REPLACED_IN_PRODUCTION_ENV_FILE_32_BYTES}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-c2VjdXJlX2tleV8zMl9ieXRlc19leGFtcGxlXzEyMzQ1Njc=}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-linuxops_db}
      POSTGRES_USER: ${POSTGRES_USER:-linuxops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPasswordSecurely!}
      PKI_CA_DIR: /etc/linuxops/pki
      PKI_CA_CERT: /etc/linuxops/pki/ca.crt
      PKI_CA_KEY: /etc/linuxops/pki/ca.key
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-linuxops}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      APP_URL: ${APP_URL:-http://localhost:3002}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3002","http://localhost:8000"]}'
    ports:
      - "8000:8000"
    volumes:
      - pki_data:/etc/linuxops/pki
    networks:
      - linuxops-internal
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: linuxops-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    volumes:
      - ./nginx/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./agent_dist/install-agent.sh:/usr/share/nginx/html/install-agent.sh:ro
      - ./agent_dist/agent-bundle.tar.gz:/usr/share/nginx/html/agent-bundle.tar.gz:ro
    networks:
      - linuxops-internal
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  linuxops-internal:
    driver: bridge

volumes:
  postgres_data:
  pki_data:
  loki_data:
